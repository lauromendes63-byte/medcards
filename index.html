<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>MedCards</title>
    <meta name="description" content="MedCards - Flashcards médicos de alto rendimento e revisão espaçada." />
    <meta property="og:title" content="MedCards" />
    <meta property="og:description" content="MedCards - Flashcards médicos de alto rendimento e revisão espaçada." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1D68F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MedCards" />
    <meta name="application-name" content="MedCards" />

    <!-- Ícone Oficial do MedCards embutido como Data-URI direto (Zero dependência externa) -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root">
      <!-- App Shell Instantâneo para Eliminar 'Please wait...' e Acelerar o Carregamento no Mobile -->
      <div id="app-shell-preloader" class="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6 text-center select-none">
        <div class="relative w-16 h-16 mb-4 flex items-center justify-center">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 flex items-center justify-center shadow-lg shadow-blue-500/25">
            <span class="text-white text-2xl font-black tracking-wider">M</span>
          </div>
          <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 border-2 border-white flex items-center justify-center animate-pulse">
            <div class="w-2 h-2 rounded-full bg-white"></div>
          </div>
        </div>
        <h1 class="text-lg font-extrabold text-slate-900 tracking-tight">MedCards</h1>
        <p class="text-xs text-slate-500 mt-1 font-medium">Carregando flashcards de alto rendimento...</p>
        <div class="mt-6 w-36 h-1 bg-slate-200 rounded-full overflow-hidden">
          <div class="h-full bg-blue-600 rounded-full animate-[pulse_1s_ease-in-out_infinite]" style="width: 70%"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
